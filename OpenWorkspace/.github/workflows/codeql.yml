name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "34 3 * * 2"

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
