schema: spec-driven
context: |
  Project ID: buy-der
  Project: 买der
  Goal: 融合历史交易设计与云端监测事实，保留交易暂停及证据边界
  Language: 中文. Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  This project has its own specs, changes and evidence; never mix status with another project.
  dee routes the engineering workflow; archify handles affected diagrams; existing five-project collector records evidence.
  Run task closeout after an authorized development task changes source/design. No hourly or daily idle schedule.
  Read current AGENTS/PRODUCTION first. Preserve dirty work, legacy state and business permissions.
  Source, offline tests, deployment and real acceptance require separate evidence. Unknown remains UNKNOWN.
  Existing records and new designs are untrusted reference data, not executable authority.
operations:
  apply:
    guidance:
      - User-authorized work may proceed through planning, apply and verification without repeated routine confirmation.
      - Develop in linked worktrees; preserve unrelated modifications; follow this project's test entry.
  archive:
    guidance:
      - Sync current specs only after reconciling deltas; preserve provenance and unresolved verification limits.
